[package]
name = "godgrader-core"
description = "Fachlogik von GodGrader, unabhängig von Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"
