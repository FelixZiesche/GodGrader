[workspace]
resolver = "2"
members = ["crates/godgrader-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Felix Ziesche"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Abhängigkeiten auch im Entwicklungsbuild optimieren (Bildverarbeitung, PDF)
[profile.dev.package."*"]
opt-level = 2
